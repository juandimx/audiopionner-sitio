<body>
<span data-relpath=""></span>
<div id="siteHeader"></div>

<div class="container">
  <div class="breadcrumbs"><a href="index.html">Inicio</a> / Tiendas</div>
  <h1 style="font-size:2rem; margin-bottom:8px;">Nuestras tiendas</h1>
  <p style="color:var(--text-muted); margin-bottom:32px; max-width:560px;">Visítanos en Santa Marta o Ciénaga, o recoge tu pedido online en cualquiera de nuestras 5 sedes.</p>

  <div class="stores-grid" id="storesGrid"></div>

  <div class="co-card">
    <h3>Contacto</h3>
    <p style="font-size:.9rem; color:var(--text-muted);">Sr. Carlos Rodríguez — Gerente<br>WhatsApp / Teléfono: 316 384 5802</p>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
      <a href="https://wa.me/573163845802" target="_blank" rel="noopener" class="btn btn-primary btn-sm">Escribir por WhatsApp</a>
      <a href="tel:+573163845802" class="btn btn-outline btn-sm">Llamar</a>
    </div>
  </div>
</div>

<div style="height:40px;"></div>
<div id="siteFooter"></div>

<script src="products.js"></script>
<script src="main.js"></script>
<script>
document.getElementById("storesGrid").innerHTML = STORE_INFO.stores.map(s => `
  <div class="co-card" style="margin-bottom:0;">
    <h3 style="display:flex; align-items:center; gap:8px;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      ${s.city}
    </h3>
    <p style="font-size:.88rem; color:var(--text-muted);">${s.address}</p>
    <p style="font-size:.78rem; color:var(--text-soft); margin-top:8px;">Recogida en tienda disponible</p>
    <a href="${s.maps}" target="_blank" rel="noopener" class="text-link" style="display:inline-block; margin-top:10px; font-size:.85rem;">Cómo llegar</a>
  </div>
`).join("");
</script>
