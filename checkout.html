<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09447E">
<title>Checkout — AudioPionner</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<span data-relpath=""></span>
<div id="siteHeader"></div>

<div class="container">
  <div class="breadcrumbs"><a href="index.html">Inicio</a> / <a href="carrito.html">Carrito</a> / Checkout</div>
  <h1 style="font-size:2rem; margin-bottom:6px;">Finalizar compra</h1>
  <p style="color:var(--text-muted); margin-bottom:10px;">Sitio demo académico — no se procesan pagos reales.</p>

  <div id="checkoutWrap"></div>
</div>

<div style="height:60px;"></div>
<div id="siteFooter"></div>

<script src="products.js"></script>
<script src="main.js"></script>
<script>
// "Comprar ahora" desde la ficha de producto (?id=&qty=) paga solo ese producto
// y deja intacto lo que haya en el carrito.
const params = new URLSearchParams(window.location.search);
const buyNowId = parseInt(params.get("id"));
const buyNowQty = Math.max(1, parseInt(params.get("qty")) || 1);
const isBuyNow = Number.isInteger(buyNowId) && hasPrice(buyNowId);
let checkoutItems = isBuyNow ? [{ id: buyNowId, qty: buyNowQty }] : getCart();

// Los datos del cliente se guardan aquí para no perderlos al cambiar de opción
const form = { name: "", doc: "", phone: "", email: "", address: "" };
const esc = (v) => String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

let fulfillment = "pickup"; // pickup | delivery
let selectedStoreIndex = 0;
let selectedStore = STORE_INFO.stores[0];
let payMethod = "card";

function subtotalOf(items){
  return items.reduce((sum,i)=>{
    const p = PRODUCTS.find(p=>p.id===i.id);
    return p ? sum + p.price*i.qty : sum;
  }, 0);
}

function renderCheckout(){
  const wrap = document.getElementById("checkoutWrap");
  if(checkoutItems.length === 0){
    wrap.innerHTML = `<div class="empty-state"><p>No tienes productos para pagar.</p><a href="muebles.html" class="btn btn-primary" style="margin-top:12px;">Ver muebles</a></div>`;
    return;
  }
  const subtotal = subtotalOf(checkoutItems);
  const shipping = fulfillment === "delivery" ? 65000 : 0;
  const total = subtotal + shipping;

  wrap.innerHTML = `
    <div class="checkout-grid">
      <div>
        <div class="co-card">
          <h3>1. Método de entrega</h3>
          <label class="radio-opt ${fulfillment==='pickup'?'selected':''}" onclick="setFulfillment('pickup')">
            <input type="radio" name="ff" ${fulfillment==='pickup'?'checked':''}>
            <div><strong>Recoger en tienda — Gratis</strong><p style="margin:4px 0 0; font-size:.8rem; color:var(--text-muted);">Te avisamos por WhatsApp cuando tu pedido esté listo. Muestra tu código de confirmación al recogerlo.</p></div>
          </label>
          <label class="radio-opt ${fulfillment==='delivery'?'selected':''}" onclick="setFulfillment('delivery')">
            <input type="radio" name="ff" ${fulfillment==='delivery'?'checked':''}>
            <div><strong>Envío a nivel nacional</strong><p style="margin:4px 0 0; font-size:.8rem; color:var(--text-muted);">Costo estimado ${formatCOP(65000)}. El valor final y el tiempo de entrega se confirman según tu ciudad. Instalación no incluida.</p></div>
          </label>

          <div id="pickupStoreSelect" style="${fulfillment==='pickup'?'':'display:none'}; margin-top:12px;">
            <label for="storeSelect" style="font-size:.8rem; font-weight:600; display:block; margin-bottom:6px;">Elige la sede</label>
            <select class="sort-select" style="width:100%;" id="storeSelect" onchange="selectedStoreIndex = +this.value; selectedStore = STORE_INFO.stores[this.value]">
              ${STORE_INFO.stores.map((s,i)=>`<option value="${i}" ${i===selectedStoreIndex?'selected':''}>${s.city} — ${s.address}</option>`).join("")}
            </select>
          </div>
        </div>

        <form class="co-card" id="customerForm" novalidate onsubmit="return false" oninput="form[event.target.name] = event.target.value">
          <h3>2. Tus datos</h3>
          <div class="form-grid-2">
            <div class="form-row"><label for="f-name">Nombre completo</label><input id="f-name" name="name" type="text" autocomplete="name" placeholder="Nombre y apellido" value="${esc(form.name)}" required></div>
            <div class="form-row"><label for="f-doc">Cédula</label><input id="f-doc" name="doc" type="text" inputmode="numeric" pattern="[0-9]{6,10}" placeholder="Solo números" value="${esc(form.doc)}" required></div>
          </div>
          <div class="form-grid-2">
            <div class="form-row"><label for="f-phone">Celular</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" pattern="3[0-9 ]{9,11}" placeholder="300 000 0000" value="${esc(form.phone)}" required></div>
            <div class="form-row"><label for="f-email">Correo electrónico</label><input id="f-email" name="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com" value="${esc(form.email)}" required></div>
          </div>
          <div class="form-row" id="addressRow" style="${fulfillment==='delivery'?'':'display:none'}">
            <label for="f-address">Dirección de envío</label>
            <input id="f-address" name="address" type="text" autocomplete="street-address" placeholder="Dirección, ciudad, departamento" value="${esc(form.address)}" ${fulfillment==='delivery'?'required':''}>
          </div>
          <p class="form-error" id="formError" role="alert" hidden></p>
        </form>

        <div class="co-card">
          <h3>3. Método de pago</h3>
          <div class="pay-methods">
            <label class="pay-opt ${payMethod==='card'?'selected':''}" onclick="setPay('card')">
              <input type="radio" name="pay" ${payMethod==='card'?'checked':''}> Tarjeta débito / crédito <span style="margin-left:auto; font-size:.68rem; background:#5433FF; color:#fff; padding:2px 8px; border-radius:4px;">STRIPE — PAGO REAL DE PRUEBA</span>
            </label>
            <label class="pay-opt ${payMethod==='pse'?'selected':''}" onclick="setPay('pse')">
              <input type="radio" name="pay" ${payMethod==='pse'?'checked':''}> PSE — débito desde tu banco
            </label>
            <label class="pay-opt ${payMethod==='addi'?'selected':''}" onclick="setPay('addi')">
              <input type="radio" name="pay" ${payMethod==='addi'?'checked':''}> Addi — paga a cuotas
            </label>
            <label class="pay-opt ${payMethod==='alo'?'selected':''}" onclick="setPay('alo')">
              <input type="radio" name="pay" ${payMethod==='alo'?'checked':''}> Alo Credit — paga a cuotas
            </label>
            <label class="pay-opt ${payMethod==='banco'?'selected':''}" onclick="setPay('banco')">
              <input type="radio" name="pay" ${payMethod==='banco'?'checked':''}> Banco de Bogotá — financiación
            </label>
          </div>
          ${payMethod === 'card'
            ? `<p style="font-size:.74rem; color:var(--text-soft); margin-top:12px;">Te llevará a la pasarela real de Stripe (modo prueba). Usa la tarjeta de prueba <strong>4242 4242 4242 4242</strong>, cualquier fecha futura y cualquier CVC para simular un pago aprobado.</p>`
            : `<p style="font-size:.74rem; color:var(--text-soft); margin-top:12px;">Este método queda simulado en esta demo — no conectado a una pasarela real todavía.</p>`
          }
        </div>
      </div>

      <div>
        <div class="co-card">
          <h3>Resumen del pedido</h3>
          ${checkoutItems.map(i=>{
            const p = PRODUCTS.find(p=>p.id===i.id);
            if(!p) return "";
            return `<div style="display:flex; justify-content:space-between; font-size:.85rem; padding:8px 0; border-bottom:1px solid var(--border);">
              <span>${p.name} × ${i.qty}</span><strong>${formatCOP(p.price*i.qty)}</strong>
            </div>`;
          }).join("")}
          <div style="display:flex; justify-content:space-between; font-size:.85rem; padding:10px 0;"><span>Subtotal</span><span>${formatCOP(subtotal)}</span></div>
          <div style="display:flex; justify-content:space-between; font-size:.85rem; padding:0 0 10px;"><span>Envío</span><span>${shipping ? formatCOP(shipping) : 'Gratis'}</span></div>
          <div class="cart-subtotal" style="border-top:1px solid var(--border); padding-top:12px;"><span>Total</span><span>${formatCOP(total)}</span></div>
          <button class="btn btn-accent btn-block" id="confirmBtn" onclick="handleConfirm()">
            ${payMethod === 'card' ? 'Pagar con Stripe' : 'Confirmar pedido'}
          </button>
          ${payMethod === 'card' ? `<p style="text-align:center; font-size:.72rem; color:var(--text-soft); margin-top:8px;">Serás redirigido a Stripe (sandbox) — no se cobra dinero real.</p>` : ""}
        </div>
      </div>
    </div>
  `;
}

function setFulfillment(v){
  fulfillment = v;
  renderCheckout();
}
function setPay(v){
  payMethod = v;
  renderCheckout();
}

function validateForm(){
  const f = document.getElementById("customerForm");
  const err = document.getElementById("formError");
  const invalid = [...f.querySelectorAll("input")].filter(i => !i.checkValidity());
  f.querySelectorAll("input").forEach(i => i.setAttribute("aria-invalid", String(!i.checkValidity())));
  if(invalid.length){
    const labels = invalid.map(i => f.querySelector(`label[for="${i.id}"]`).textContent.toLowerCase());
    err.textContent = "Revisa estos datos: " + labels.join(", ") + ".";
    err.hidden = false;
    invalid[0].focus();
    return false;
  }
  err.hidden = true;
  return true;
}

async function handleConfirm(){
  if(!validateForm()) return;
  if(payMethod === 'card'){
    await payWithStripe();
  } else {
    confirmOrder();
  }
}

async function payWithStripe(){
  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;
  btn.textContent = "Conectando con Stripe...";

  // Guardamos los datos del pedido para recuperarlos en la página de éxito
  sessionStorage.setItem("ap_pending_order", JSON.stringify({
    items: checkoutItems, fulfillment, store: selectedStore, isBuyNow
  }));

  try{
    // Solo se envían IDs y cantidades: el precio lo calcula el servidor.
    const res = await fetch("/api/create-checkout-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        items: checkoutItems.map(i => ({ id: i.id, qty: i.qty })),
        fulfillment,
      }),
    });
    const data = await res.json();
    if(data.url){
      window.location.href = data.url;
    } else {
      alert("No se pudo iniciar el pago: " + (data.error || "Error desconocido. ¿Ya desplegaste el sitio con la función activa?"));
      btn.disabled = false;
      btn.textContent = "Pagar con Stripe";
    }
  } catch(err){
    alert("No se pudo conectar con la función de pago. Esto solo funciona una vez el sitio esté publicado en Netlify con la función activa (no funciona abriendo el archivo local).");
    btn.disabled = false;
    btn.textContent = "Pagar con Stripe";
  }
}

function generateCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "AP-";
  for(let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function confirmOrder(){
  const code = generateCode();
  const subtotal = subtotalOf(checkoutItems);
  const shipping = fulfillment === "delivery" ? 65000 : 0;
  const total = subtotal + shipping;

  document.getElementById("checkoutWrap").innerHTML = `
    <div class="confirm-code-box">
      <p style="opacity:.85; font-size:.9rem;">¡Pedido registrado con éxito!</p>
      <div class="code">${code}</div>
      <p style="opacity:.9; font-size:.85rem;">
        ${fulfillment === 'pickup'
          ? `Muestra este código en <strong>${selectedStore.city} — ${selectedStore.address}</strong> para recoger tu pedido.`
          : `Guarda este código: te servirá para hacer seguimiento a tu envío.`}
      </p>
      <p style="opacity:.75; font-size:.78rem; margin-top:14px;">Total del pedido: ${formatCOP(total)}</p>
    </div>
    <div style="text-align:center; margin-top:24px;">
      <a href="index.html" class="btn btn-primary">Volver al inicio</a>
      <a href="https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent('Hola, mi código de pedido es '+code)}" target="_blank" class="btn btn-outline" style="margin-left:10px;">Escribir por WhatsApp</a>
    </div>
  `;
  if(!isBuyNow){ localStorage.setItem("ap_cart", "[]"); }
  updateCartCount();
}

renderCheckout();
</script>
</body>
</html>
