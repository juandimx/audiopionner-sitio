<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09447E">
<title id="pageTitleTag">Producto — AudioPionner</title>
<meta name="description" content="Muebles AudioPionner con garantía de 12 meses, envío a toda Colombia y financiación.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AudioPionner">
<meta property="og:locale" content="es_CO">
<meta property="og:title" content="Producto — AudioPionner">
<meta property="og:description" content="Muebles AudioPionner con garantía de 12 meses, envío a toda Colombia y financiación.">
<meta property="og:image" content="https://audiopionnerdemo.netlify.app/sala-nube.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../logo.png">
<link rel="apple-touch-icon" href="../logo.png">
<link rel="stylesheet" href="../styles.css">
<style>
.pay-info{ border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin:16px 0; }
.pay-info h4{ margin:0 0 8px; font-size:.9rem; }
.pay-info p{ margin:8px 0 0; font-size:.8rem; color:var(--text-muted); }
</style>
</head>
<body>
<span data-relpath=""></span>
<div id="siteHeader"></div>

<div class="container">
  <div class="breadcrumbs" id="breadcrumbs"></div>
  <div class="pdp" id="pdpRoot"></div>

  <section class="section" style="padding-top:0;">
    <div class="section-head">
      <div><h2>También te puede interesar</h2></div>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</div>

<div id="siteFooter"></div>

<script src="../products.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>
<script src="../espacio.js"></script>
<script>
const id = parseInt(new URLSearchParams(window.location.search).get("id"));
const product = PRODUCTS.find(p => p.id === id);

if(!product){
  document.getElementById("pdpRoot").innerHTML = `<div class="empty-state"><h3>Producto no encontrado</h3><a href="muebles.html" class="btn btn-primary" style="margin-top:12px;">Volver a muebles</a></div>`;
} else {
  document.title = product.name + " — AudioPionner";
  document.querySelector('meta[name="description"]')?.setAttribute("content", `${product.name}. ${product.description}`);
  document.getElementById("breadcrumbs").innerHTML = `
    <a href="index.html">Inicio</a> / <a href="muebles.html">Muebles</a> /
    <a href="muebles.html?sub=${product.subcategory}">${product.subcategoryLabel}</a> / ${product.name}
  `;

  const hasDiscount = product.compareAtPrice && product.compareAtPrice > product.price;
  const pct = hasDiscount ? Math.round((1 - product.price/product.compareAtPrice)*100) : 0;
  const installment = product.price != null ? Math.round(product.price / 12) : 0;
  const colors = product.colors || [];
  const startColor = Math.min(Math.max(parseInt(new URLSearchParams(location.search).get("color")) || 0, 0), Math.max(colors.length - 1, 0));
  let color = colors[startColor] || null;
  const sizes = product.sizes || [];
  let size = null;
  const slug = (c) => (product.name + (c ? " " + c.name : "")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  // Mensaje de WhatsApp con el enlace del producto: WhatsApp muestra la foto del mueble en la vista previa
  const waFor = (c) => {
    const photo = `https://audiopionnerdemo.netlify.app/catalogo/p/${slug(c)}.html`;
    const text = `Hola AudioPionner 👋 Quiero comprar este producto: *${product.name}*${c ? " (color " + c.name.toLowerCase() + ")" : ""}${size ? ", medida " + size : ""}.\n${photo}`;
    return `https://wa.me/${STORE_INFO.whatsapp}?text=${encodeURIComponent(text)}`;
  };
  const waLink = waFor(color);

  document.getElementById("pdpRoot").innerHTML = `
    <div class="pdp-gallery">
      <div class="main-img" style="--img:url('${color ? color.image : product.image}')"><img src="${color ? color.image : product.image}" alt="${product.name}" id="mainImg" width="900" height="900"></div>
    </div>
    <div class="pdp-info">
      <span class="brand">${product.brand}</span>
      <h1>${product.name}</h1>
      ${colors.length ? `
      <div class="color-pick">
        <span class="color-label">Color: <b id="colorName">${color.name}</b></span>
        <div class="swatches" role="radiogroup" aria-label="Elegir color">
          ${colors.map((c,i)=>`<button type="button" class="swatch${i===startColor?' on':''}" role="radio" aria-checked="${i===startColor}" aria-label="${c.name}" title="${c.name}" style="--c:${c.hex}" onclick="pickColor(${i})"></button>`).join("")}
        </div>
      </div>` : ""}
      ${sizes.length ? `
      <div class="size-pick">
        <span class="color-label">Medida: <b id="sizeName">elige una</b></span>
        <div class="size-chips" role="radiogroup" aria-label="Elegir medida">
          ${sizes.map((z,i)=>`<button type="button" class="size-chip" role="radio" aria-checked="false" onclick="pickSize(${i})">${z}</button>`).join("")}
        </div>
      </div>` : ""}
      <p class="pdp-installments">Pídelo por WhatsApp y te confirmamos disponibilidad, medidas y envío.</p>
      <div class="pdp-actions">
        <a href="${waLink}" target="_blank" rel="noopener" class="btn btn-accent btn-block wa-link">Comprar ahora por WhatsApp</a>
        <button type="button" class="btn btn-outline btn-block cam-open">📷 Ver en tu espacio</button>
      </div>

      <div class="fulfillment-box">
        <div class="opt">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <div><h4>Recoger en tienda — gratis</h4><p>Disponible en las 5 sedes AudioPionner (Santa Marta y Ciénaga). Te avisamos por WhatsApp cuando esté listo.</p></div>
        </div>
        <div class="opt">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/></svg>
          <div><h4>Envío a nivel nacional</h4><p>Instalación no incluida. Tiempos y costo de envío se confirman por WhatsApp.</p></div>
        </div>
      </div>

      <div class="pay-info">
        <h4>Medios de pago</h4>
        <div class="finance-row">
          <span class="finance-chip">Addi</span>
          <span class="finance-chip">Sistecrédito</span>
          <span class="finance-chip">Alo Credit</span>
          <span class="finance-chip">Banco de Bogotá</span>
          <span class="finance-chip">PSE</span>
          <span class="finance-chip">Tarjeta débito/crédito</span>
        </div>
        <p>Este catálogo no recibe pagos. Escríbenos por WhatsApp y te ayudamos a pagar con el medio que prefieras.</p>
      </div>

      <div class="pdp-tabs">
        <div class="tab-head">
          <button class="active" onclick="switchTab(event,'desc')">Descripción</button>
          <button onclick="switchTab(event,'specs')">Especificaciones</button>
          <button onclick="switchTab(event,'shipping')">Envío y garantía</button>
        </div>
        <div class="tab-panel active" id="tab-desc"><p>${product.description}</p></div>
        <div class="tab-panel" id="tab-specs">
          ${Object.entries(product.specs).map(([k,v])=>`<div class="spec-row"><span>${k}</span><strong>${v}</strong></div>`).join("")}
        </div>
        <div class="tab-panel" id="tab-shipping">
          <p>Envíos a todo el territorio nacional colombiano. La instalación no está incluida. Todas las piezas AudioPionner cuentan con garantía directa de fábrica de 12 meses por defectos de manufactura.</p>
        </div>
      </div>
    </div>
  `;

  window.pickSize = (i) => {
    size = sizes[i];
    document.getElementById("sizeName").textContent = size;
    document.querySelectorAll(".size-chip").forEach((b,k) => { b.classList.toggle("on", k===i); b.setAttribute("aria-checked", k===i); });
    document.querySelectorAll(".wa-link").forEach(a => a.href = waFor(color));
  };
  window.pickColor = (i) => {
    color = colors[i];
    document.getElementById("colorName").textContent = color.name;
    document.querySelectorAll(".swatch").forEach((b,k) => { b.classList.toggle("on", k===i); b.setAttribute("aria-checked", k===i); });
    const img = document.getElementById("mainImg");
    img.src = color.image; img.alt = product.name + " color " + color.name.toLowerCase();
    img.parentElement.style.setProperty("--img", `url('${color.image}')`);
    document.querySelectorAll(".wa-link").forEach(a => a.href = waFor(color));
  };
  // Precarga las fotos de los otros colores
  colors.slice(1).forEach(c => { const im = new Image(); im.src = c.image; });

  window.__qty = 1;
  // Ver en tu espacio: abre la cámara con el mueble (del color elegido) recortado
  document.querySelectorAll(".cam-open").forEach(b => b.addEventListener("click", () => {
    VerEnTuEspacio.open({
      name: product.name + (color ? " " + color.name : ""),
      img: (color && color.cutout) || product.cutout || product.image,
      logo: "../logo.png"
    });
  }));
  window.changeQty = (delta) => {
  };
  window.switchTab = (e, key) => {
    document.querySelectorAll(".tab-head button").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    document.getElementById("tab-"+key).classList.add("active");
  };

  // Related products: same subcategory, excluding current
  const related = PRODUCTS.filter(p => p.subcategory === product.subcategory && p.id !== product.id).slice(0,4);
  document.getElementById("relatedGrid").innerHTML = related.map(productCard).join("");
}
</script>
</body>
</html>
