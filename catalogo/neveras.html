<script>
const SUBCATS = [
  { key: "all", label: "Todas las neveras" },
];

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

let currentSub = "all";
let currentSort = "relevance";
let promoOnly = false;

function renderTabs(){
  document.getElementById("subTabs").innerHTML = SUBCATS.map(s => `
    <button class="tab ${s.key===currentSub?'active':''}" aria-pressed="${s.key===currentSub}" onclick="setSub('${s.key}')">${s.label}</button>
  `).join("");
}
function setSub(key){
  currentSub = key;
  promoOnly = false;
  const url = new URL(window.location);
  if(key === 'all') url.searchParams.delete('sub'); else url.searchParams.set('sub', key);
  url.searchParams.delete('promo');
  window.history.replaceState({}, '', url);
  renderTabs();
  renderGrid();
}

function renderGrid(){
  let list = PRODUCTS.filter(p => p.subcategory === "neveras");
  if(promoOnly) list = list.filter(p => p.compareAtPrice);

  // Los productos sin precio (por cotizar) siempre quedan al final al ordenar por precio
  const pr = (p, dir) => p.price == null ? (dir > 0 ? Infinity : -Infinity) : p.price;
  if(currentSort === "price-asc") list.sort((a,b)=>pr(a,1)-pr(b,1));
  else if(currentSort === "price-desc") list.sort((a,b)=>pr(b,-1)-pr(a,-1));
  else if(currentSort === "name") list.sort((a,b)=>a.name.localeCompare(b.name));

  const grid = document.getElementById("productGrid");
  const empty = document.getElementById("emptyState");
  document.getElementById("resultCount").textContent = `${list.length} producto${list.length!==1?'s':''}`;

  if(list.length === 0){
    grid.style.display = "none";
    empty.style.display = "block";
  } else {
    grid.style.display = "grid";
    empty.style.display = "none";
    grid.innerHTML = list.map(productCard).join("");
  }

  const sub = SUBCATS.find(s=>s.key===currentSub);
  document.getElementById("pageTitle").textContent = promoOnly ? "Promociones" : "Neveras";
  document.getElementById("bcLabel").textContent = "Neveras";
  document.title = (promoOnly ? "Promociones" : "Neveras") + " — AudioPionner";
}

document.getElementById("sortSelect").addEventListener("change", (e)=>{
  currentSort = e.target.value;
  renderGrid();
});

renderTabs();
renderGrid();
</script>
